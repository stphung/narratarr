[package]
name = "narratarr"
version = "0.1.0"
edition = "2021"
description = "The narrator for your bookshelf: mirrors an ebook library into a monitored audiobook collection"
license = "MIT"

[dependencies]
difflib = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true

[dev-dependencies]
toml = "0.8"
