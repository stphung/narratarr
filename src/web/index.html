<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>narratarr</title>
<style>
  :root {
    --bg: #14151a; --card: #1e2026; --edge: #2c2f38; --text: #e6e6e9;
    --dim: #9a9daa; --accent: #7aa2f7; --good: #4fd18b; --bad: #f7768e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--edge);
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  header .tag { color: var(--dim); font-size: 13px; }
  #count { margin-left: auto; color: var(--dim); font-size: 13px; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  .card { background: var(--card); border: 1px solid var(--edge); border-radius: 10px;
          padding: 16px; margin-bottom: 14px; }
  .book { font-weight: 600; font-size: 16px; }
  .book small { color: var(--dim); font-weight: 400; }
  .best { color: var(--dim); margin: 6px 0 10px; font-size: 14px; }
  .best b { color: var(--text); font-weight: 500; }
  .conf { color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { border: 1px solid var(--edge); background: #262933; color: var(--text);
           border-radius: 7px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.accept { border-color: var(--good); color: var(--good); }
  button.reject { border-color: var(--bad); color: var(--bad); }
  .alts { margin-top: 12px; display: none; }
  .alt { display: flex; gap: 12px; align-items: center; padding: 9px;
         border: 1px solid var(--edge); border-radius: 8px; margin-bottom: 8px;
         cursor: pointer; }
  .alt:hover { border-color: var(--good); background: #23262e; }
  .alt img { width: 56px; height: 56px; border-radius: 6px; object-fit: cover;
             background: #333; flex: none; }
  .alt .meta { min-width: 0; }
  .alt .t { font-weight: 500; }
  .alt .n { color: var(--dim); font-size: 13px; }
  .alt .score { margin-left: auto; color: var(--accent); font-size: 13px; flex: none; }
  .done { opacity: .45; pointer-events: none; }
  .empty { text-align: center; color: var(--dim); padding: 60px 0; }
  .note { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>narratarr</h1><span class="tag">review queue</span>
  <span id="count"></span>
</header>
<main id="list"><div class="empty">loading…</div></main>
<script>
const list = document.getElementById('list');
const count = document.getElementById('count');
let remaining = 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function setCount() {
  count.textContent = remaining
    ? remaining + ' book' + (remaining === 1 ? '' : 's') + ' awaiting review'
    : 'queue clear';
}

async function decide(card, key, action, asin) {
  const r = await fetch('/api/decide', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({key, action, asin}),
  });
  if (r.ok) {
    card.classList.add('done');
    remaining--; setCount();
  } else {
    alert('failed: ' + (await r.json()).error);
  }
}

function runtime(min) {
  if (!min) return '';
  return ' · ' + Math.floor(min / 60) + 'h ' + (min % 60) + 'm';
}

async function loadAlternatives(card, key, box, btn) {
  btn.disabled = true; btn.textContent = 'searching…';
  const r = await fetch('/api/alternatives?key=' + encodeURIComponent(key));
  btn.textContent = 'alternatives';
  btn.disabled = false;
  if (!r.ok) { alert('search failed'); return; }
  const data = await r.json();
  box.textContent = '';
  if (!data.items.length) box.append(el('div', 'note', 'no candidates found'));
  for (const it of data.items) {
    const row = el('div', 'alt');
    const img = el('img');
    if (it.image_url) img.src = it.image_url;
    const meta = el('div', 'meta');
    meta.append(el('div', 't', it.title + (it.subtitle ? ': ' + it.subtitle : '')));
    meta.append(el('div', 'n',
      (it.authors || []).join(', ') +
      ((it.narrators || []).length ? ' · read by ' + it.narrators.join(', ') : '') +
      runtime(it.runtime_min)));
    const score = el('div', 'score', it.total.toFixed(2));
    row.append(img, meta, score);
    row.title = 'accept this edition';
    row.onclick = () => decide(card, key, 'accept', it.asin);
    box.append(row);
  }
  box.style.display = 'block';
}

function card(item) {
  const c = el('div', 'card');
  const title = el('div', 'book', item.ebook_title || item.key.split('|')[1] || item.key);
  if (item.ebook_author) {
    title.append(' ');
    const a = el('small', '', '— ' + item.ebook_author);
    title.append(a);
  }
  const best = el('div', 'best');
  best.append('best candidate: ');
  best.append(el('b', '', item.candidate || '(unknown)'));
  if (item.confidence != null) {
    best.append(' ');
    best.append(el('span', 'conf', item.confidence.toFixed(2)));
  }
  const row = el('div', 'row');
  const accept = el('button', 'accept', 'accept best');
  accept.onclick = () => decide(c, item.key, 'accept', item.asin);
  const alts = el('button', '', 'alternatives');
  const reject = el('button', 'reject', 'no audiobook wanted');
  reject.onclick = () => decide(c, item.key, 'skip');
  const box = el('div', 'alts');
  alts.onclick = () => loadAlternatives(c, item.key, box, alts);
  row.append(accept, alts, reject);
  c.append(title, best, row, box,
    el('div', 'note', 'accepted books sync to Listenarr on the next cycle'));
  return c;
}

(async () => {
  const r = await fetch('/api/queue');
  const data = await r.json();
  list.textContent = '';
  remaining = data.items.length;
  setCount();
  if (!remaining) {
    list.append(el('div', 'empty', 'nothing to review — narratarr is all caught up'));
    return;
  }
  for (const item of data.items) list.append(card(item));
})();
</script>
</body>
</html>
